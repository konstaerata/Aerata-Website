<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1b2025" />
    <link rel="manifest" href="/manifest.json" />

    <!-- CDN preconnect — reduces latency for all R2-hosted media -->
    <link rel="preconnect" href="https://pub-8d398fd9e3a643679e74a0eacc815464.r2.dev" crossorigin />
    <link rel="dns-prefetch" href="https://pub-8d398fd9e3a643679e74a0eacc815464.r2.dev" />
    <link rel="preconnect" href="https://media.aerata.com" />

    <!-- Fallback title/description/OG/Twitter tags for the brief pre-hydration
         window and for the noscript view below. Every real route overrides
         all of these via react-helmet-async (see src/components/SEO.jsx) —
         but react-helmet-async only manages tags IT renders; it does not
         remove tags already present in this static HTML. Previously this
         file also had a static canonical + duplicate og:*/twitter:* tags
         that were never removed once a page's <SEO> mounted, so every route
         briefly shipped two conflicting canonical/OG tags. Keep this block
         to the minimum needed for noscript/pre-hydration; do not add a
         static <link rel="canonical"> or duplicate og:*/twitter:* tags here
         again — they will conflict with every page's own <SEO>. -->
    <title>Aerata B.V. — Aerial Intelligence for Industry</title>

    <!-- Google Analytics and HubSpot load only after cookie consent (src/lib/consent.js). -->
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding:2rem;text-align:center;font-family:sans-serif">
        <h1>Aerata B.V. — Aerial Intelligence for Industry</h1>
        <p>Enterprise drone inspection and aerial data services across Europe. Thermal imaging, LiDAR surveys, and photogrammetric mapping for renewable energy, infrastructure, surveying, and oil &amp; gas industries.</p>
        <p>Please enable JavaScript to use the full Aerata website, or contact us at <a href="mailto:info@aerata.com">info@aerata.com</a> or call <a href="tel:+31638165193">+31 6 38165193</a>.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
