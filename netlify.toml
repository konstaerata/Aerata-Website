[build]
  command = "npm run build"
  publish = "dist"

# ── Redirects ────────────────────────────────────────────────────────────────

# www → non-www (canonical domain)
[[redirects]]
  from = "https://www.aerata.com/*"
  to = "https://aerata.com/:splat"
  status = 301
  force = true

# www.aerata.gr → aerata.gr (mirrors the .com normalization above)
[[redirects]]
  from = "https://www.aerata.gr/*"
  to = "https://aerata.gr/:splat"
  status = 301
  force = true

# robots.txt is fetched directly by crawlers (never JS-rendered), so it's the
# one place that can't be made host-aware client-side — serve a .gr-specific
# file on that host. force = true is required: /robots.txt already exists as
# a static file, and Netlify skips redirects that match an existing file
# unless forced. status = 200 (rewrite, not a redirect) so the URL bar and
# crawler both see /robots.txt, just with different content per host.
[[redirects]]
  from = "/robots.txt"
  to = "/robots-gr.txt"
  status = 200
  force = true
  conditions = {Host = ["aerata.gr", "www.aerata.gr"]}

# Custom 404
[[redirects]]
  from = "/404"
  to = "/404.html"
  status = 404

# SPA catch-all — must be last
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ── Security Headers (all pages) ────────────────────────────────────────────

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self), interest-cohort=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://js-eu1.hs-scripts.com https://js-eu1.hsforms.net https://js.hsforms.net https://forms-eu1.hsforms.com https://js.hs-banner.com https://js.hs-analytics.net https://js.hubspot.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://pub-8d398fd9e3a643679e74a0eacc815464.r2.dev https://media.aerata.com https://media.base44.com https://*.hubspot.com https://*.hsforms.com https://www.google-analytics.com https://www.googletagmanager.com; media-src 'self' https://pub-8d398fd9e3a643679e74a0eacc815464.r2.dev https://media.aerata.com; connect-src 'self' https://*.hubspot.com https://*.hsforms.com https://*.hs-scripts.com https://*.hs-analytics.net https://*.base44.com https://pub-8d398fd9e3a643679e74a0eacc815464.r2.dev https://media.aerata.com https://www.google-analytics.com https://*.google-analytics.com https://www.googletagmanager.com; frame-src 'self' https://*.hubspot.com https://*.hsforms.com https://www.google.com https://maps.google.com; object-src 'none'; base-uri 'self'; form-action 'self' https://*.hubspot.com https://*.hsforms.com"

# ── Cache: hashed static assets (immutable) ─────────────────────────────────

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Cache: HTML pages (always revalidate) ────────────────────────────────────

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ── Cache: static media in /media/ ───────────────────────────────────────────

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# ── Sitemap & robots ────────────────────────────────────────────────────────

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"
