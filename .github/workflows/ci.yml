name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: SEO basics check
        run: npm run check:seo-basics

      - name: Build (includes sitemap generation)
        run: npm run build

      - name: Domain SEO check (aerata.com / aerata.gr canonical + hreflang)
        run: npm run check:domain-seo
